<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="quantumGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C7CFF"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#0B0F1A"/>

  <!-- Orbit Rings -->
  <ellipse cx="256" cy="256" rx="160" ry="64"
    stroke="url(#quantumGradient)" stroke-width="8"
    transform="rotate(25 256 256)" />

  <ellipse cx="256" cy="256" rx="160" ry="64"
    stroke="url(#quantumGradient)" stroke-width="8"
    transform="rotate(-25 256 256)" />

  <!-- Electron Dots -->
  <circle cx="128" cy="256" r="8" fill="#00E5FF"/>
  <circle cx="384" cy="256" r="8" fill="#7C7CFF"/>

  <!-- Q Letter -->
  <text x="256" y="300"
    text-anchor="middle"
    font-size="180"
    font-family="Inter, system-ui, sans-serif"
    font-weight="600"
    fill="url(#quantumGradient)">
    Q
  </text>
</svg>
