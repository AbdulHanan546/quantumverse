<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics: Simple Harmonic Motion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Theme: Zinc-900 & Green */
        
        /* Range Input Styling */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #4ade80; /* Green-400 */
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 0 10px rgba(74, 222, 128, 0.5);
            transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #27272a; /* Zinc-800 */
            border-radius: 2px;
        }
        input[type=range]:focus {
            outline: none;
        }

        /* Utility Classes */
        .glow-text {
            text-shadow: 0 0 15px rgba(74, 222, 128, 0.4);
        }
        .font-mono-nums {
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>
<body class="bg-black flex items-center justify-center min-h-screen p-4 overflow-hidden">

    <!-- Main Container: 16/9 Aspect Ratio -->
    <div class="relative w-full max-w-6xl aspect-video bg-zinc-900 rounded-2xl shadow-2xl overflow-hidden border border-zinc-800 flex flex-col">
        
        <!-- Header -->
        <div class="absolute top-0 left-0 w-full p-6 z-10 flex justify-between items-start pointer-events-none">
            <div>
                <h1 class="text-3xl font-bold text-green-400 glow-text tracking-wider uppercase">Harmonic Motion</h1>
                <p class="text-zinc-500 text-sm mt-1">Mass-Spring System Simulation</p>
            </div>
            <div class="flex gap-4">
                <div class="bg-zinc-950/80 backdrop-blur px-4 py-2 rounded border border-zinc-800 text-xs text-zinc-400 font-mono">
                    <span class="text-green-500 font-bold">x(t)</span> = A cos(&omega;t)
                </div>
                <div class="bg-zinc-950/80 backdrop-blur px-4 py-2 rounded border border-zinc-800 text-xs text-zinc-400 font-mono">
                    <span class="text-zinc-300">&omega;</span> = &radic;(k / m)
                </div>
            </div>
        </div>

        <!-- Canvas Area -->
        <div class="flex-grow relative w-full h-full bg-zinc-900" id="canvas-container">
            <canvas id="simCanvas" class="block w-full h-full"></canvas>
            
            <!-- Graph Legend Overlay -->
            <div class="absolute top-1/2 right-6 -translate-y-1/2 flex flex-col gap-2 pointer-events-none opacity-80">
                <div class="flex items-center gap-2">
                    <div class="w-3 h-3 rounded-full bg-green-400 shadow-[0_0_10px_#4ade80]"></div>
                    <span class="text-[10px] text-zinc-400 uppercase tracking-widest">Displacement</span>
                </div>
                <div class="flex items-center gap-2">
                    <div class="w-3 h-3 rounded-full bg-zinc-600"></div>
                    <span class="text-[10px] text-zinc-400 uppercase tracking-widest">Equilibrium</span>
                </div>
            </div>
        </div>

        <!-- Controls UI -->
        <div class="absolute bottom-0 w-full bg-zinc-950/90 backdrop-blur border-t border-zinc-800 p-6 z-20">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-8 items-center">
                
                <!-- Mass Control -->
                <div class="space-y-2">
                    <div class="flex justify-between items-center">
                        <label class="text-xs font-bold text-zinc-500 uppercase tracking-widest">Mass (m)</label>
                        <span id="val-mass" class="text-xs text-green-400 font-mono font-bold">2.0 kg</span>
                    </div>
                    <input type="range" id="input-mass" min="0.5" max="10" step="0.5" value="2.0">
                </div>

                <!-- Spring Constant Control -->
                <div class="space-y-2">
                    <div class="flex justify-between items-center">
                        <label class="text-xs font-bold text-zinc-500 uppercase tracking-widest">Spring Constant (k)</label>
                        <span id="val-k" class="text-xs text-green-400 font-mono font-bold">5.0 N/m</span>
                    </div>
                    <input type="range" id="input-k" min="1" max="20" step="1" value="5">
                </div>

                <!-- Amplitude Control -->
                <div class="space-y-2">
                    <div class="flex justify-between items-center">
                        <label class="text-xs font-bold text-zinc-500 uppercase tracking-widest">Amplitude (A)</label>
                        <span id="val-amp" class="text-xs text-green-400 font-mono font-bold">150 px</span>
                    </div>
                    <input type="range" id="input-amp" min="0" max="250" step="10" value="150">
                </div>

                <!-- Playback Controls -->
                <div class="flex gap-3 justify-end">
                    <button id="btn-reset" class="px-4 py-2 bg-zinc-800 hover:bg-zinc-700 text-zinc-400 border border-zinc-700 rounded transition-colors text-xs font-bold uppercase tracking-wide">
                        Reset
                    </button>
                    <button id="btn-pause" class="px-6 py-2 bg-zinc-900 hover:bg-zinc-800 text-green-400 border border-green-900/50 hover:border-green-500/50 rounded transition-all text-xs font-bold uppercase tracking-wide shadow-[0_0_15px_rgba(74,222,128,0.1)]">
                        Pause
                    </button>
                </div>

            </div>
        </div>
    </div>

    <script>
        /**
         * Simple Harmonic Motion Simulation
         * Theme: Zinc-900 & Green
         */

        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');

        // Configuration State
        const state = {
            mass: 2.0,      // kg
            k: 5.0,         // N/m
            amplitude: 150, // pixels
            isRunning: true,
            time: 0,
            dt: 0.1         // Time step
        };

        // Graph History
        const maxHistory = 300;
        let history = []; // Stores {t, y}

        // DOM Elements
        const controls = {
            mass: document.getElementById('input-mass'),
            k: document.getElementById('input-k'),
            amp: document.getElementById('input-amp'),
            valMass: document.getElementById('val-mass'),
            valK: document.getElementById('val-k'),
            valAmp: document.getElementById('val-amp'),
            pause: document.getElementById('btn-pause'),
            reset: document.getElementById('btn-reset')
        };

        // --- Resize Logic ---
        let width, height;
        function resize() {
            width = container.clientWidth;
            height = container.clientHeight;
            // Handle High DPI displays
            const dpr = window.devicePixelRatio || 1;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
        }
        window.addEventListener('resize', resize);
        resize();

        // --- Physics Calculations ---
        function getPhysics() {
            // Angular frequency: w = sqrt(k/m)
            const omega = Math.sqrt(state.k / state.mass);
            
            // Displacement: x = A * cos(w*t)
            // Note: We use negative cos so it starts stretched (optional choice) or positive. 
            // Let's use cos: starts at amplitude.
            const displacement = state.amplitude * Math.cos(omega * state.time);
            
            // Velocity: v = -A * w * sin(w*t)
            const velocity = -state.amplitude * omega * Math.sin(omega * state.time);

            return { displacement, velocity, omega };
        }

        // --- Drawing Helpers ---

        function drawSpring(x1, y1, x2, y2, coils, width) {
            ctx.beginPath();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#71717a'; // Zinc-500
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';

            const dx = x2 - x1;
            const dy = y2 - y1;
            const dist = Math.sqrt(dx * dx + dy * dy);
            
            // Normal vectors
            const nx = dy / dist * width;
            const ny = -dx / dist * width;

            // Draw start segment
            ctx.moveTo(x1, y1);
            
            // Coil logic
            const step = dist / coils;
            for (let i = 1; i <= coils; i++) {
                // Determine zig-zag offset
                let offX = 0, offY = 0;
                if (i !== coils) {
                    const sign = (i % 2 === 0) ? 1 : -1;
                    offX = nx * sign;
                    offY = ny * sign;
                }
                
                // Linear interpolation point on the line
                const px = x1 + (dx * (i / coils));
                const py = y1 + (dy * (i / coils));
                
                ctx.lineTo(px + offX, py + offY);
            }
            ctx.stroke();
        }

        function drawGrid() {
            // Background Grid
            ctx.strokeStyle = '#18181b'; // Zinc-950
            ctx.lineWidth = 1;
            ctx.beginPath();
            const gridSize = 40;
            for(let x = 0; x < width; x+=gridSize) { ctx.moveTo(x, 0); ctx.lineTo(x, height); }
            for(let y = 0; y < height; y+=gridSize) { ctx.moveTo(0, y); ctx.lineTo(width, y); }
            ctx.stroke();

            // Equilibrium Line
            ctx.strokeStyle = '#27272a'; // Zinc-800 dashed
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(width * 0.4, 0); // Vertical center of the physical area
            ctx.lineTo(width * 0.4, height);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function drawGraph() {
            // Define Graph Area (Bottom half of screen or right side? Let's do Bottom)
            const graphYBase = height * 0.75;
            const graphScaleY = 0.5; // Scale down amplitude for graph fitting
            
            // Draw axis line
            ctx.strokeStyle = '#3f3f46'; // Zinc-700
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, graphYBase);
            ctx.lineTo(width, graphYBase);
            ctx.stroke();

            // Draw Curve
            if (history.length < 2) return;

            ctx.beginPath();
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#4ade80'; // Green-400
            ctx.shadowColor = '#4ade80';
            ctx.shadowBlur = 10; // Neon glow

            // Map history to graph coordinates
            // We want the graph to scroll left. 
            // The newest point is at right edge of graph area.
            
            const startX = width * 0.4; // Start graph after the physical block area
            const graphWidth = width - startX - 20;

            for (let i = 0; i < history.length; i++) {
                const pt = history[i];
                // X coordinate: Map index to width
                const x = startX + ((i / maxHistory) * graphWidth);
                // Y coordinate: Base +/- displacement
                const y = graphYBase - (pt.disp * graphScaleY);

                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
            
            // Reset Shadow
            ctx.shadowBlur = 0;
            
            // Draw connecting line from block to graph (Visual aid)
            const lastPt = history[history.length - 1];
            if(lastPt) {
                const finalGraphX = startX + ((history.length-1) / maxHistory * graphWidth);
                const finalGraphY = graphYBase - (lastPt.disp * graphScaleY);
                
                ctx.beginPath();
                ctx.fillStyle = '#4ade80';
                ctx.arc(finalGraphX, finalGraphY, 4, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // --- Main Animation Loop ---
        function animate() {
            if (!state.isRunning) return;

            // Clear
            ctx.clearRect(0, 0, width, height);
            
            // Update Physics
            const phys = getPhysics();
            
            // Store History
            history.push({ t: state.time, disp: phys.displacement });
            if (history.length > maxHistory) history.shift();

            // 1. Draw Background Grid
            drawGrid();

            // 2. Physical Representation (Top Area)
            const centerX = width * 0.4; // Equilibrium X position
            const centerY = height * 0.35; // Vertical position of the block
            const currentX = centerX + phys.displacement;

            // Draw Wall
            ctx.fillStyle = '#27272a'; // Zinc-800
            ctx.fillRect(0, centerY - 40, 20, 80);

            // Draw Spring
            // From Wall (20) to Block Left Edge (currentX - blockWidth/2)
            drawSpring(20, centerY, currentX - 40, centerY, 20, 15);

            // Draw Mass Block
            ctx.fillStyle = '#18181b'; // Zinc-950
            ctx.strokeStyle = '#4ade80'; // Green-400
            ctx.lineWidth = 2;
            
            // Glow effect for block
            ctx.shadowColor = 'rgba(74, 222, 128, 0.3)';
            ctx.shadowBlur = 20;
            
            const blockSize = 80;
            ctx.fillRect(currentX - blockSize/2, centerY - blockSize/2, blockSize, blockSize);
            ctx.strokeRect(currentX - blockSize/2, centerY - blockSize/2, blockSize, blockSize);
            
            // Label 'm'
            ctx.fillStyle = '#4ade80';
            ctx.font = 'bold 16px monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowBlur = 0; // Remove text blur
            ctx.fillText('m', currentX, centerY);

            // Draw Velocity Vector (Arrow)
            if (Math.abs(phys.velocity) > 5) {
                const vecScale = 0.1;
                const vecLen = phys.velocity * vecScale;
                const arrowY = centerY + 60;
                
                ctx.beginPath();
                ctx.strokeStyle = '#facc15'; // Yellow for velocity to distinguish slightly, or Green
                ctx.strokeStyle = '#22c55e'; // Green-500 (Darker green)
                ctx.lineWidth = 4;
                ctx.moveTo(currentX, arrowY);
                ctx.lineTo(currentX + vecLen, arrowY);
                ctx.stroke();
                
                // Arrowhead
                ctx.beginPath();
                ctx.fillStyle = '#22c55e';
                const headSize = 6;
                const dir = Math.sign(vecLen);
                ctx.moveTo(currentX + vecLen, arrowY);
                ctx.lineTo(currentX + vecLen - (headSize*dir), arrowY - headSize);
                ctx.lineTo(currentX + vecLen - (headSize*dir), arrowY + headSize);
                ctx.fill();
                
                ctx.fillStyle = '#22c55e';
                ctx.font = '10px sans-serif';
                ctx.fillText('v', currentX + vecLen/2, arrowY + 15);
            }

            // 3. Draw Graph
            drawGraph();

            // Advance Time
            state.time += state.dt;

            requestAnimationFrame(animate);
        }

        // --- Interactions ---

        function updateLabels() {
            controls.valMass.innerText = parseFloat(state.mass).toFixed(1) + " kg";
            controls.valK.innerText = parseFloat(state.k).toFixed(0) + " N/m";
            controls.valAmp.innerText = parseFloat(state.amplitude).toFixed(0) + " px";
        }

        controls.mass.addEventListener('input', (e) => {
            state.mass = parseFloat(e.target.value);
            updateLabels();
            history = []; // Clear graph on param change for visual cleanliness
            state.time = 0;
        });

        controls.k.addEventListener('input', (e) => {
            state.k = parseFloat(e.target.value);
            updateLabels();
            history = [];
            state.time = 0;
        });

        controls.amp.addEventListener('input', (e) => {
            state.amplitude = parseFloat(e.target.value);
            updateLabels();
            history = [];
            state.time = 0;
        });

        controls.pause.addEventListener('click', () => {
            state.isRunning = !state.isRunning;
            controls.pause.innerText = state.isRunning ? "Pause" : "Play";
            controls.pause.classList.toggle('bg-zinc-900');
            controls.pause.classList.toggle('bg-green-900/20'); // Highlight when paused
            if (state.isRunning) animate();
        });

        controls.reset.addEventListener('click', () => {
            state.time = 0;
            history = [];
            // Reset Inputs
            state.mass = 2.0; controls.mass.value = 2.0;
            state.k = 5.0; controls.k.value = 5.0;
            state.amplitude = 150; controls.amp.value = 150;
            updateLabels();
            
            if(!state.isRunning) {
                state.isRunning = true;
                controls.pause.innerText = "Pause";
                animate();
            }
        });

        // Initialize
        animate();

    </script>
</body>
</html>
