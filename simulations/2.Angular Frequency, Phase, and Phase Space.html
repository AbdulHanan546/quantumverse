<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics: Phase Space & SHM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Theme Configuration: Zinc-900 & Green-400 */
        
        /* Custom Scrollbar and Range Slider */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #4ade80; /* Green-400 */
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 0 10px rgba(74, 222, 128, 0.5);
            transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #27272a; /* Zinc-800 */
            border-radius: 2px;
        }
        input[type=range]:focus {
            outline: none;
        }
        
        /* Typography & Glows */
        .glow-text {
            text-shadow: 0 0 15px rgba(74, 222, 128, 0.4);
        }
        .canvas-label {
            font-family: 'Courier New', Courier, monospace;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body class="bg-black flex items-center justify-center min-h-screen p-4 overflow-hidden">

    <!-- Main Container: 16/9 Aspect Ratio -->
    <div class="relative w-full max-w-7xl aspect-video bg-zinc-900 rounded-2xl shadow-2xl overflow-hidden border border-zinc-800 flex flex-col">
        
        <!-- Header -->
        <div class="absolute top-0 left-0 w-full p-6 z-10 flex justify-between items-start pointer-events-none">
            <div>
                <h1 class="text-3xl font-bold text-green-400 glow-text tracking-wider uppercase">Harmonic Motion</h1>
                <p class="text-zinc-500 text-sm mt-1">Analyzing Angular Frequency (<span class="italic font-serif">ω</span>), Phase (<span class="italic font-serif">φ</span>), and Phase Space</p>
            </div>
            
            <!-- Formulas -->
            <div class="bg-zinc-950/80 backdrop-blur px-5 py-3 rounded border border-zinc-800 text-xs text-zinc-400 flex gap-6">
                <div>
                    <span class="text-zinc-500 block text-[10px] uppercase tracking-widest">Position</span>
                    <span class="text-green-500 font-bold">x(t)</span> = A cos(<span class="text-white">ω</span>t + <span class="text-white">φ</span>)
                </div>
                <div class="border-l border-zinc-700 pl-6">
                    <span class="text-zinc-500 block text-[10px] uppercase tracking-widest">Velocity</span>
                    <span class="text-green-500 font-bold">v(t)</span> = -Aω sin(<span class="text-white">ω</span>t + <span class="text-white">φ</span>)
                </div>
            </div>
        </div>

        <!-- Canvas Area -->
        <div class="flex-grow relative w-full h-full bg-zinc-900" id="canvas-container">
            <canvas id="simCanvas" class="block w-full h-full"></canvas>
            
            <!-- Overlay Labels for Canvas Sections -->
            <div class="absolute top-1/2 left-[16%] -translate-x-1/2 -translate-y-[120px] pointer-events-none opacity-20 text-4xl font-bold text-zinc-500">PHASOR</div>
            <div class="absolute top-1/2 left-[50%] -translate-x-1/2 -translate-y-[120px] pointer-events-none opacity-20 text-4xl font-bold text-zinc-500">TIME DOMAIN</div>
            <div class="absolute top-1/2 left-[83%] -translate-x-1/2 -translate-y-[120px] pointer-events-none opacity-20 text-4xl font-bold text-zinc-500">PHASE SPACE</div>
        </div>

        <!-- Controls UI -->
        <div class="absolute bottom-0 w-full bg-zinc-950/90 backdrop-blur border-t border-zinc-800 p-6 z-20">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-8 items-end">
                
                <!-- Angular Frequency Control -->
                <div class="space-y-3">
                    <div class="flex justify-between items-center">
                        <label class="text-xs font-bold text-zinc-500 uppercase tracking-widest">Angular Freq (ω)</label>
                        <span id="val-omega" class="text-xs text-green-400 font-mono">1.0 rad/s</span>
                    </div>
                    <input type="range" id="omega" min="0.1" max="5.0" step="0.1" value="1.0">
                </div>

                <!-- Phase Constant Control -->
                <div class="space-y-3">
                    <div class="flex justify-between items-center">
                        <label class="text-xs font-bold text-zinc-500 uppercase tracking-widest">Phase Constant (φ)</label>
                        <span id="val-phase" class="text-xs text-green-400 font-mono">0.0 rad</span>
                    </div>
                    <input type="range" id="phase" min="0" max="6.28" step="0.1" value="0.0">
                </div>

                <!-- Amplitude Control -->
                <div class="space-y-3">
                    <div class="flex justify-between items-center">
                        <label class="text-xs font-bold text-zinc-500 uppercase tracking-widest">Amplitude (A)</label>
                        <span id="val-amp" class="text-xs text-green-400 font-mono">1.0</span>
                    </div>
                    <input type="range" id="amp" min="0.2" max="1.5" step="0.1" value="1.0">
                </div>

                <!-- Playback Controls -->
                <div class="flex gap-3 justify-end">
                    <button id="btn-reset" class="px-4 py-2 bg-zinc-800 hover:bg-zinc-700 text-zinc-400 border border-zinc-700 rounded transition-colors font-medium text-xs uppercase tracking-wider">
                        Reset t=0
                    </button>
                    <button id="btn-pause" class="px-6 py-2 bg-green-500/10 hover:bg-green-500/20 text-green-400 border border-green-500/50 rounded transition-colors font-bold text-xs uppercase tracking-wider shadow-[0_0_10px_rgba(74,222,128,0.2)]">
                        Stop / Start
                    </button>
                </div>

            </div>
        </div>
    </div>

    <script>
        /**
         * Simulation Logic
         * We visualize SHM in three views:
         * 1. Reference Circle (Phasor)
         * 2. Time Domain (x vs t)
         * 3. Phase Space (v vs x)
         */

        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');

        // State
        let t = 0;
        let isRunning = true;
        let width, height;
        let trail = []; // Stores history for plotting

        // Parameters
        let params = {
            omega: 1.0,  // Angular Frequency
            phase: 0.0,  // Phase Shift
            amp: 1.0     // Amplitude (Base unit is pixels scaled)
        };

        // UI References
        const ui = {
            omega: document.getElementById('omega'),
            phase: document.getElementById('phase'),
            amp: document.getElementById('amp'),
            valOmega: document.getElementById('val-omega'),
            valPhase: document.getElementById('val-phase'),
            valAmp: document.getElementById('val-amp'),
            btnPause: document.getElementById('btn-pause'),
            btnReset: document.getElementById('btn-reset')
        };

        // Resizing
        function resize() {
            width = container.clientWidth;
            height = container.clientHeight;
            canvas.width = width * window.devicePixelRatio;
            canvas.height = height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }
        window.addEventListener('resize', resize);
        resize();

        // Helper: Draw Arrow
        function drawArrow(fromX, fromY, toX, toY, color) {
            const headlen = 10;
            const angle = Math.atan2(toY - fromY, toX - fromX);
            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(fromX, fromY);
            ctx.lineTo(toX, toY);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(toX, toY);
            ctx.lineTo(toX - headlen * Math.cos(angle - Math.PI / 6), toY - headlen * Math.sin(angle - Math.PI / 6));
            ctx.lineTo(toX - headlen * Math.cos(angle + Math.PI / 6), toY - headlen * Math.sin(angle + Math.PI / 6));
            ctx.lineTo(toX, toY);
            ctx.fill();
        }

        // Main Draw Loop
        function animate() {
            if (!isRunning) {
                requestAnimationFrame(animate);
                return;
            }

            // Clear Background
            ctx.clearRect(0, 0, width, height);

            // Calculation
            // Scale factor to make the simulation look good on screen
            const scale = Math.min(width, height) / 5; 
            const currentAmp = params.amp * scale;
            
            // Core Physics Formula
            // theta = omega * t + phase
            const theta = params.omega * t + params.phase;
            
            // Position (x) and Velocity (v)
            // Note: Canvas Y is inverted (down is positive). 
            // We'll map math Y to Canvas Y: centerY - y
            const x = currentAmp * Math.cos(theta); 
            // Velocity is derivative. For visualization, we normalize it slightly differently to fit the phase space box
            // v_math = -A * w * sin(theta)
            const v = -currentAmp * params.omega * Math.sin(theta); 
            
            // Normalize velocity for display so phase space doesn't explode with high Omega
            // We scale V visually by dividing by Omega if we want a circle, 
            // but for a true phase space, ellipses are accurate. We will clamp it visually.
            const v_display = v / (params.omega > 0 ? 1 : 1); 

            // Update Trail
            trail.push({ t_x: t, pos: x, vel: v_display });
            if (trail.length > 300) trail.shift();

            // --- LAYOUT CONSTANTS ---
            const cy = height / 2;
            const center1 = width * 0.16; // Phasor Center X
            const center2Start = width * 0.33; // Time Domain Start X
            const center2End = width * 0.66;
            const center3 = width * 0.83; // Phase Space Center X

            ctx.lineWidth = 1;
            ctx.strokeStyle = '#3f3f46'; // Zinc-700
            
            // Draw Dividers
            ctx.beginPath();
            ctx.moveTo(width * 0.33, 20); ctx.lineTo(width * 0.33, height - 20);
            ctx.moveTo(width * 0.66, 20); ctx.lineTo(width * 0.66, height - 20);
            ctx.stroke();

            // ==========================================
            // 1. PHASOR DIAGRAM (Rotary Motion)
            // ==========================================
            
            // Reference Circle
            ctx.beginPath();
            ctx.strokeStyle = '#27272a';
            ctx.arc(center1, cy, currentAmp, 0, Math.PI * 2);
            ctx.stroke();

            // Axis
            ctx.beginPath();
            ctx.moveTo(center1 - currentAmp - 20, cy);
            ctx.lineTo(center1 + currentAmp + 20, cy);
            ctx.moveTo(center1, cy - currentAmp - 20);
            ctx.lineTo(center1, cy + currentAmp + 20);
            ctx.stroke();

            // The Rotating Vector (Phasor)
            // Canvas coords: cos maps to x, sin maps to y (inverted)
            // We want x to represent position, so it's the horizontal projection.
            const phasorX = center1 + x;
            const phasorY = cy - (currentAmp * Math.sin(theta)); 

            // Draw Vector
            drawArrow(center1, cy, phasorX, phasorY, '#a1a1aa'); // Grey Vector
            
            // Draw Projection line to X-axis (Position)
            ctx.setLineDash([4, 4]);
            ctx.strokeStyle = '#4ade80';
            ctx.beginPath();
            ctx.moveTo(phasorX, phasorY);
            ctx.lineTo(phasorX, cy);
            ctx.stroke();
            ctx.setLineDash([]);

            // Draw Dot
            ctx.fillStyle = '#4ade80';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#4ade80';
            ctx.beginPath();
            ctx.arc(phasorX, phasorY, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // ==========================================
            // 2. TIME DOMAIN (Wave)
            // ==========================================
            // x(t) plot. Time flows to the right? Or shifts left?
            // Let's make the wave shift left (scrolling oscilloscope style)

            ctx.save();
            ctx.beginPath();
            ctx.rect(center2Start, 0, center2End - center2Start, height);
            ctx.clip(); // Clip to middle section

            // Center Line
            ctx.strokeStyle = '#27272a';
            ctx.beginPath();
            ctx.moveTo(center2Start, cy);
            ctx.lineTo(center2End, cy);
            ctx.stroke();

            ctx.beginPath();
            ctx.strokeStyle = '#4ade80';
            ctx.lineWidth = 2;
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#4ade80';
            
            // Draw wave based on history
            // We map the latest t to the left edge of the domain? No, latest to right edge makes more sense.
            // Let's iterate backwards from latest.
            
            const timeScale = 40; // Pixels per time unit
            
            for (let i = 0; i < trail.length; i++) {
                const point = trail[trail.length - 1 - i];
                const dt = t - point.t_x;
                const plotX = (center2Start + 20) + (dt * timeScale); // Moving Right?
                // Actually, let's simulate scrolling LEFT.
                // Current time is at a fixed position, history is to the right? 
                // Let's put Current Time at the Left side, and history flows right.
                
                if (plotX > center2End) break;

                const plotY = cy - point.pos; // Invert Y for canvas

                if (i === 0) ctx.moveTo(plotX, plotY);
                else ctx.lineTo(plotX, plotY);
            }
            ctx.stroke();
            
            // Connecting Line from Phasor to Wave (Visual Aid)
            // Only if they align horizontally. Here they don't exactly align because Phasor is X-based.
            // But visually, the "Height" of the wave corresponds to Phasor X-projection?
            // No, in standard physics: 
            // Phasor projection on X-axis = x(t). 
            // In our wave plot, y-axis = x(t).
            // So the horizontal position of Phasor Dot should match vertical position of Wave Dot.
            
            // Let's draw a connecting line from Phasor X-projection to Wave Start
            ctx.setLineDash([2, 6]);
            ctx.strokeStyle = '#52525b'; // Darker grey
            ctx.shadowBlur = 0;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(phasorX, cy); // From Phasor projected onto axis
            // To the start of the wave plot (where x(t) is mapped to Y)
            // Wave Y = cy - x
            // Phasor X = center1 + x. 
            // This is a rotation of axes 90 degrees. Hard to connect visually with a straight line.
            // We'll skip the connecting line to avoid confusion, as axes are rotated.

            ctx.restore();

            // Label axes for Time Domain
            ctx.fillStyle = "#52525b";
            ctx.font = "10px sans-serif";
            ctx.fillText("x (Position)", center2Start + 10, cy - currentAmp - 10);
            ctx.fillText("t (Time) →", center2End - 50, cy + 15);


            // ==========================================
            // 3. PHASE SPACE (Velocity vs Position)
            // ==========================================
            
            // Axis
            ctx.strokeStyle = '#27272a';
            ctx.beginPath();
            // Vertical (Velocity)
            ctx.moveTo(center3, cy - height/3);
            ctx.lineTo(center3, cy + height/3);
            // Horizontal (Position)
            ctx.moveTo(center3 - width/8, cy);
            ctx.lineTo(center3 + width/8, cy);
            ctx.stroke();

            // Draw Trajectory (Ellipse)
            ctx.beginPath();
            ctx.strokeStyle = '#4ade80'; 
            ctx.lineWidth = 2;
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#4ade80';

            // We draw the full theoretical ellipse to look nice
            // x = A cos(theta), v = -A w sin(theta)
            // We draw this parametrically independent of time to show the "track"
            // Then we draw the dot on it.
            
            /* Ghost Track */
            ctx.save();
            ctx.strokeStyle = '#166534'; // Dark Green
            ctx.setLineDash([2, 4]);
            ctx.shadowBlur = 0;
            ctx.lineWidth = 1;
            ctx.beginPath();
            for(let ang = 0; ang <= Math.PI*2; ang+=0.1) {
                const px = center3 + (currentAmp * Math.cos(ang));
                const py = cy - (-currentAmp * params.omega * Math.sin(ang)) / (params.omega > 0.1 ? 2 : 1) * 0.5; 
                // Note: We dampen the Y scaling of the velocity axis visually so it fits
                if(ang===0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.stroke();
            ctx.restore();

            // Current State Dot
            // Position on Canvas
            const psX = center3 + x;
            // Velocity on Canvas (Vertical). 
            // We scale velocity visually: v_display. 
            // To fit nicely, let's divide by a factor.
            const scaleVel = 0.5; 
            const psY = cy - (v * scaleVel);

            // Draw Head
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(psX, psY, 4, 0, Math.PI*2);
            ctx.fill();

            // Trail in Phase Space
            ctx.beginPath();
            ctx.strokeStyle = '#4ade80';
            for (let i = 0; i < Math.min(trail.length, 100); i++) {
                const pt = trail[trail.length - 1 - i];
                const tx = center3 + pt.pos;
                const ty = cy - (pt.vel * scaleVel); // Applying same scale factor
                if (i===0) ctx.moveTo(tx, ty);
                else ctx.lineTo(tx, ty);
            }
            ctx.stroke();

            // Labels
            ctx.fillStyle = "#52525b";
            ctx.fillText("Velocity (v)", center3 + 5, cy - height/3);
            ctx.fillText("Position (x)", center3 + width/8 - 50, cy - 5);


            // Increment Time
            t += 0.05;
            requestAnimationFrame(animate);
        }

        // Interaction Logic
        function updateParams() {
            params.omega = parseFloat(ui.omega.value);
            params.phase = parseFloat(ui.phase.value);
            params.amp = parseFloat(ui.amp.value);

            ui.valOmega.textContent = params.omega.toFixed(1) + " rad/s";
            ui.valPhase.textContent = params.phase.toFixed(1) + " rad";
            ui.valAmp.textContent = params.amp.toFixed(1);
            
            // If dragging phase, we might want to reset t or adjust t so the jump isn't jarring?
            // For now, simple parameter update is physically accurate (instant shift).
        }

        [ui.omega, ui.phase, ui.amp].forEach(el => el.addEventListener('input', updateParams));

        ui.btnPause.addEventListener('click', () => {
            isRunning = !isRunning;
            if(isRunning) animate();
        });

        ui.btnReset.addEventListener('click', () => {
            t = 0;
            trail = [];
            if(!isRunning) {
                isRunning = true;
                animate();
            }
        });

        // Start
        animate();

    </script>
</body>
</html>
