<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics: Quantum Tunneling</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Theme: Zinc-900 & Green-400 */
        
        /* Custom Slider Styling */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #4ade80; /* Green-400 */
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 0 10px rgba(74, 222, 128, 0.5);
            border: 2px solid #18181b; /* Zinc-950 */
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #27272a; /* Zinc-800 */
            border-radius: 2px;
        }
        input[type=range]:focus {
            outline: none;
        }
        
        /* Text Glow */
        .glow-text {
            text-shadow: 0 0 15px rgba(74, 222, 128, 0.4);
        }

        /* Canvas Glow */
        canvas {
            filter: drop-shadow(0 0 2px rgba(74, 222, 128, 0.1));
        }
    </style>
</head>
<body class="bg-black flex items-center justify-center min-h-screen p-4 font-sans select-none">

    <!-- Main Container: 16/9 Aspect Ratio -->
    <div class="relative w-full max-w-6xl aspect-video bg-zinc-900 rounded-2xl shadow-2xl overflow-hidden border border-zinc-800 flex flex-col">
        
        <!-- Header Overlay -->
        <div class="absolute top-0 left-0 w-full p-6 z-10 flex justify-between items-start pointer-events-none">
            <div>
                <h1 class="text-3xl font-bold text-green-400 glow-text tracking-wider uppercase">Quantum Tunneling</h1>
                <p class="text-zinc-500 text-sm mt-1">Time-Dependent Schrödinger Equation</p>
            </div>
            <!-- Math Formula Display -->
            <div class="bg-zinc-950/80 backdrop-blur px-5 py-3 rounded border border-zinc-800 text-zinc-300 shadow-lg">
                <div class="text-xs text-zinc-500 mb-1 font-bold uppercase tracking-widest">Schrödinger Equation</div>
                <div class="font-serif italic text-sm text-green-100">
                    iℏ <span class="text-green-400">∂ψ</span>/∂t = 
                    -<span class="text-zinc-500">(ℏ²/2m)</span>∇²<span class="text-green-400">ψ</span> + 
                    V<span class="text-green-400">ψ</span>
                </div>
            </div>
        </div>

        <!-- Canvas Area -->
        <div class="flex-grow relative w-full h-full bg-zinc-900 cursor-crosshair" id="canvas-container">
            <canvas id="simCanvas" class="block w-full h-full"></canvas>
            
            <!-- Floating Labels (Dynamic) -->
            <div id="label-barrier" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-[10px] text-zinc-500 uppercase tracking-widest pointer-events-none hidden">
                Potential Barrier (V)
            </div>
        </div>

        <!-- Controls UI -->
        <div class="absolute bottom-0 w-full bg-zinc-950/90 backdrop-blur border-t border-zinc-800 p-6 z-20">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-8 items-end">
                
                <!-- Control 1: Barrier Height -->
                <div class="space-y-2">
                    <div class="flex justify-between items-center">
                        <label class="text-[10px] font-bold text-zinc-500 uppercase tracking-widest">Barrier Energy (V)</label>
                        <span id="val-height" class="text-xs text-green-400 font-mono">0.05</span>
                    </div>
                    <input type="range" id="input-height" min="0" max="0.15" step="0.005" value="0.05">
                </div>

                <!-- Control 2: Barrier Width -->
                <div class="space-y-2">
                    <div class="flex justify-between items-center">
                        <label class="text-[10px] font-bold text-zinc-500 uppercase tracking-widest">Barrier Thickness</label>
                        <span id="val-width" class="text-xs text-green-400 font-mono">20px</span>
                    </div>
                    <input type="range" id="input-width" min="5" max="100" step="1" value="20">
                </div>

                <!-- Simulation Controls -->
                <div class="flex flex-col items-center justify-center space-y-2">
                    <div class="flex gap-3 w-full">
                        <button id="btn-shoot" class="flex-1 py-2 bg-green-500/10 hover:bg-green-500/20 text-green-400 border border-green-500/50 rounded transition-all font-bold text-sm uppercase tracking-wide hover:shadow-[0_0_15px_rgba(74,222,128,0.3)]">
                            Fire Particle
                        </button>
                    </div>
                    <p class="text-[10px] text-zinc-600 text-center leading-tight">
                        <span class="text-green-500">Green Glow:</span> Probability Density (|ψ|²)<br>
                        <span class="text-zinc-500">Grey Line:</span> Real Component (Re[ψ])
                    </p>
                </div>

                 <!-- Stats / Readout -->
                 <div class="border-l border-zinc-800 pl-6 flex flex-col justify-center space-y-1">
                    <div class="flex justify-between text-xs">
                        <span class="text-zinc-500">Transmission:</span>
                        <span id="stat-trans" class="text-green-400 font-mono">0%</span>
                    </div>
                    <div class="flex justify-between text-xs">
                        <span class="text-zinc-500">Reflection:</span>
                        <span id="stat-ref" class="text-zinc-400 font-mono">0%</span>
                    </div>
                    <div class="w-full bg-zinc-800 h-1 mt-2 rounded-full overflow-hidden">
                        <div id="prob-bar" class="h-full bg-green-500 w-0 transition-all duration-300"></div>
                    </div>
                 </div>

            </div>
        </div>
    </div>

    <script>
        /**
         * Simulation Logic: 1D Schrödinger Equation Solver
         * Method: Finite Difference Time Domain (FDTD)
         */

        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const container = document.getElementById('canvas-container');

        // Physics Constants
        const N = 400; // Grid resolution
        let dx, dt;
        
        // Wave Function Arrays (Real and Imaginary parts)
        let psiR = new Float32Array(N);
        let psiI = new Float32Array(N);
        
        // Potential Array
        let V = new Float32Array(N);
        
        // Simulation State
        let width, height;
        let animationId;
        
        // Controls State
        const state = {
            barrierHeight: 0.05,
            barrierWidth: 20, // grid units
            barrierX: N / 2,
            transmission: 0,
            reflection: 0
        };

        // DOM Elements
        const ui = {
            inputHeight: document.getElementById('input-height'),
            inputWidth: document.getElementById('input-width'),
            valHeight: document.getElementById('val-height'),
            valWidth: document.getElementById('val-width'),
            btnShoot: document.getElementById('btn-shoot'),
            statTrans: document.getElementById('stat-trans'),
            statRef: document.getElementById('stat-ref'),
            probBar: document.getElementById('prob-bar')
        };

        // --- Initialization ---

        function resize() {
            width = container.clientWidth;
            height = container.clientHeight;
            canvas.width = width * window.devicePixelRatio;
            canvas.height = height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            
            // Re-calculate delta x for rendering mapping
            dx = width / N; 
        }

        function initPhysics() {
            // Reset Wave Function
            psiR.fill(0);
            psiI.fill(0);
            
            // Create Gaussian Wave Packet
            const x0 = N * 0.2; // Start at 20% from left
            const sigma = 15;   // Width of packet
            const k0 = 0.5;     // Momentum (Speed)
            
            for (let i = 0; i < N; i++) {
                const x = i - x0;
                const envelope = Math.exp(-(x * x) / (2 * sigma * sigma));
                psiR[i] = envelope * Math.cos(k0 * x);
                psiI[i] = envelope * Math.sin(k0 * x);
            }
            
            updatePotential();
        }

        function updatePotential() {
            V.fill(0);
            const halfW = Math.floor(state.barrierWidth / 2);
            const start = Math.floor(state.barrierX) - halfW;
            const end = Math.floor(state.barrierX) + halfW;

            for (let i = start; i < end; i++) {
                if (i >= 0 && i < N) {
                    V[i] = state.barrierHeight;
                }
            }
        }

        // --- Physics Loop ---

        function step() {
            // Schrödinger Equation: i * dpsi/dt = H * psi
            // H = -0.5 * d^2/dx^2 + V(x)
            // Using a simple explicit Euler integration for visual effect 
            // (Note: Crank-Nicolson is better for accuracy, but this is fast for JS visuals)
            
            // Physics scaling parameters
            const h_bar = 1;
            const mass = 1;
            const dx_phys = 1;
            const dt_phys = 0.5; // Stability limit

            // Temporary arrays for next step
            const nextR = new Float32Array(N);
            const nextI = new Float32Array(N);

            for (let i = 1; i < N - 1; i++) {
                // Laplacian (2nd derivative of spatial component)
                const lapR = psiR[i+1] - 2*psiR[i] + psiR[i-1];
                const lapI = psiI[i+1] - 2*psiI[i] + psiI[i-1];

                // Hamiltonian application
                // dPsiR/dt = -H * PsiI
                // dPsiI/dt =  H * PsiR
                
                const HR = -0.5 * lapR + V[i] * psiR[i];
                const HI = -0.5 * lapI + V[i] * psiI[i];

                nextR[i] = psiR[i] - HI * dt_phys;
                nextI[i] = psiI[i] + HR * dt_phys;
            }

            // Soft Boundary Damping (absorb wave at edges to prevent reflection wrapping)
            for(let i=0; i<10; i++) {
                nextR[i] *= 0.9; nextI[i] *= 0.9;
                nextR[N-1-i] *= 0.9; nextI[N-1-i] *= 0.9;
            }

            psiR = nextR;
            psiI = nextI;
        }

        function calculateStats() {
            let leftProb = 0;
            let rightProb = 0;
            const barrierCenter = Math.floor(state.barrierX);

            for(let i=0; i<N; i++) {
                const prob = psiR[i]*psiR[i] + psiI[i]*psiI[i];
                if(i > barrierCenter + state.barrierWidth) {
                    rightProb += prob;
                } else if (i < barrierCenter - state.barrierWidth) {
                    leftProb += prob;
                }
            }
            
            // Normalize for display relative to initial packet approx
            // Visual approximation scaling
            const scale = 0.05; 
            const transP = Math.min(100, rightProb * scale * 100);
            
            ui.statTrans.innerText = transP.toFixed(1) + "%";
            ui.probBar.style.width = transP + "%";
            ui.statRef.innerText = (100 - transP).toFixed(1) + "%";
        }

        // --- Rendering ---

        function draw() {
            // 1. Clear background
            ctx.fillStyle = '#18181b'; // Zinc-950
            ctx.fillRect(0, 0, width, height);

            // 2. Draw Grid/Axis
            ctx.strokeStyle = '#27272a'; // Zinc-800
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, height/2);
            ctx.lineTo(width, height/2);
            ctx.stroke();

            // 3. Draw Potential Barrier
            const barrierHPx = state.barrierHeight * 2000; // Visual scaling
            const bWidth = state.barrierWidth * (width/N);
            const bX = (state.barrierX * (width/N)) - (bWidth/2);
            
            // Gradient Barrier
            const grad = ctx.createLinearGradient(0, height/2, 0, height/2 - barrierHPx);
            grad.addColorStop(0, 'rgba(255, 255, 255, 0.05)');
            grad.addColorStop(1, 'rgba(255, 255, 255, 0.2)');

            ctx.fillStyle = grad;
            ctx.fillRect(bX, height/2 - barrierHPx, bWidth, barrierHPx);
            
            ctx.strokeStyle = '#52525b'; // Zinc-600
            ctx.strokeRect(bX, height/2 - barrierHPx, bWidth, barrierHPx);

            // 4. Draw Wave Function
            ctx.beginPath();
            ctx.lineWidth = 3;
            const centerY = height / 2;
            const scaleY = 150; // Amplitude scaling

            // 4a. Draw Probability Density (Green Glow)
            ctx.strokeStyle = '#4ade80'; // Green-400
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#4ade80';

            for (let i = 0; i < N; i++) {
                const x = i * (width / N);
                // Probability density = |psi|^2
                const prob = (psiR[i]*psiR[i] + psiI[i]*psiI[i]);
                const y = centerY - prob * scaleY * 2; // Squared is smaller, so scale up more
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
            
            // Reset Shadow
            ctx.shadowBlur = 0;

            // 4b. Draw Real Part (Detail line, Grey)
            ctx.beginPath();
            ctx.strokeStyle = 'rgba(161, 161, 170, 0.3)'; // Zinc-400 low opacity
            ctx.lineWidth = 1;
            for (let i = 0; i < N; i++) {
                const x = i * (width / N);
                const y = centerY - psiR[i] * scaleY; // Real part oscillates
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
        }

        function animate() {
            // Run physics faster than framerate
            for(let k=0; k<8; k++) step();
            
            draw();
            calculateStats();
            animationId = requestAnimationFrame(animate);
        }

        // --- Event Listeners ---

        window.addEventListener('resize', resize);

        ui.inputHeight.addEventListener('input', (e) => {
            state.barrierHeight = parseFloat(e.target.value);
            ui.valHeight.innerText = state.barrierHeight.toFixed(3);
            updatePotential();
        });

        ui.inputWidth.addEventListener('input', (e) => {
            state.barrierWidth = parseInt(e.target.value);
            ui.valWidth.innerText = state.barrierWidth + "px";
            updatePotential();
        });

        ui.btnShoot.addEventListener('click', () => {
            initPhysics();
        });

        // --- Start ---
        resize();
        initPhysics();
        animate();

    </script>
</body>
</html>
